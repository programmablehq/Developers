name: Live read-only smoke

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-read-only-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify published read surfaces
    if: github.repository == 'programmablehq/Developers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PROGRAMMABLE_API_BASE: "https://developers.programmable.family"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build static developer resources
        run: npm run build

      - name: Run repository checks
        run: npm run check

      - name: Run read-only live smoke
        run: npm run smoke:live
